<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIMEC | Login</title>
  <style>
    :root{--primary:#b31217;--primary-dark:#7f0b0f;--text:#172033;--muted:#667085;--border:#d9e0ea}
    *{box-sizing:border-box}
    body{font-family:Roboto,system-ui,Arial;margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(179,18,23,.28),transparent 32rem),linear-gradient(135deg,#111827 0%,#0b1220 100%);color:#e5e7eb;padding:18px}
    .card{width:min(430px,94vw);background:rgba(255,255,255,.97);color:var(--text);border:1px solid rgba(255,255,255,.35);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
    .title{font-size:26px;font-weight:800;margin:0 0 6px;color:var(--primary-dark);letter-spacing:-.02em}
    .sub{margin:0 0 22px;color:var(--muted);font-size:14px}
    label{display:block;font-size:12px;font-weight:800;color:#344054;margin:14px 0 7px}
    input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--text);outline:none;font:inherit;transition:border-color .16s,box-shadow .16s}
    input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(179,18,23,.14)}
    button{width:100%;margin-top:18px;padding:13px 16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;font-weight:800;cursor:pointer;box-shadow:0 12px 24px rgba(179,18,23,.28);transition:transform .16s,box-shadow .16s,opacity .16s}
    button:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(179,18,23,.36)}
    button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
    .msg{margin-top:12px;font-size:13px;color:#b42318;min-height:18px;font-weight:700}
    .ok{color:#067647}
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">Iniciar sesión</h1>
    <p class="sub">Acceso requerido para usar SIMEC</p>

    <label for="email">Correo</label>
    <input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="username"/>

    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>

    <button id="btn" onclick="login()">Entrar</button>
    <div id="msg" class="msg"></div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
